name: Firmware bauen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6, esp32c5]
    steps:
      - uses: actions/checkout@v4
      - name: Bauen (ESP-IDF v5.4.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: ${{ matrix.target }}
          command: |
            PREVIEW=""; [ "${{ matrix.target }}" = "esp32c5" ] && PREVIEW="--preview"
            idf.py $PREVIEW set-target ${{ matrix.target }} && idf.py $PREVIEW build &&
            cd build && python -m esptool --chip ${{ matrix.target }} merge_bin -o ../skybridge-${{ matrix.target }}.bin @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: skybridge-${{ matrix.target }}
          path: skybridge-${{ matrix.target }}.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: fw
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: fw/*.bin
